<script>
  (function () {
    // A credential must never sit in the address bar. If one ever arrives
    // there — a form that navigated, a pasted link, a bookmark — it is taken
    // out of the URL and out of this history entry before anything else runs.
    try {
      var url = new URL(location.href);
      var removed = false;
      ['password', 'pass', 'pwd', 'passwd', 'token', 'secret', 'email'].forEach(function (key) {
        if (url.searchParams.has(key)) { url.searchParams.delete(key); removed = true; }
      });
      if (removed) {
        history.replaceState(null, '', url.pathname + (url.search ? url.search : '') + url.hash);
      }
    } catch (e) { /* nothing here is worth breaking a page over */ }
  })();
</script>
<script>
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem('plume-theme');
      if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
    } catch (e) {}

    // Hide the page only while a translation is actually on its way, and never
    // for longer than a moment: a failed script must not leave a blank screen.
    try {
      var stored = localStorage.getItem('plume-lang');
      var asked = /[?&]lang=/.test(location.search);
      var browser = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
      if (asked || (stored && stored !== 'en') || !/^en/i.test(browser)) {
        d.classList.add('i18n-pending');
        setTimeout(function () { d.classList.remove('i18n-pending'); }, 2000);
      }
    } catch (e) {}
  })();
</script>
